name: One-time lockfile repair

on:
  push:
    branches: ["launch-hardening"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix package lockfile [lockfile-repair]"
          git push origin HEAD:launch-hardening
